version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sdn2_tegalsari_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_sdn2tegalsari_secure}
      POSTGRES_DB: ${POSTGRES_DB:-sdn2_tegalsari_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sdn2_tegalsari_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdn_network

volumes:
  postgres_data:
    driver: local

networks:
  sdn_network:
    driver: bridge
