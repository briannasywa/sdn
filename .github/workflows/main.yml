name: SDN 2 Tegalsari DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  devsecops-pipeline:
    name: Build, Lint, Audit & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository Source Code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # 3. Install Root & Monorepo Dependencies
      - name: 📦 Install Root Dependencies
        run: npm ci

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # 4. Generate Prisma Client
      - name: 🗄️ Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      # 5. Run Linter (Shift-Left Static Analysis)
      - name: 🔍 Run ESLint Analysis (Backend)
        run: |
          cd backend
          npm run lint

      # 6. DevSecOps Security Scan (NPM Security Audit)
      - name: 🛡️ DevSecOps Security Scan - Backend Audit
        run: |
          cd backend
          npm audit --audit-level=high || echo "Security Audit Completed"

      - name: 🛡️ DevSecOps Security Scan - Frontend Audit
        run: |
          cd frontend
          npm audit --audit-level=high || echo "Security Audit Completed"

      # 7. Build Frontend Bundle Verification
      - name: 🚀 Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

      # 8. Verify Docker Compose Configuration Syntax
      - name: 🐳 Validate Docker Compose Files
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
