version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: sdn2_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_sdn2tegalsari_secure}
      POSTGRES_DB: ${POSTGRES_DB:-sdn2_tegalsari_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sdn2_tegalsari_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdn_prod_network

  # 2. Express.js REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdn2_backend_prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_sdn2tegalsari_min32chars_devsecops}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_sdn2tegalsari_secure}@postgres:5432/${POSTGRES_DB:-sdn2_tegalsari_db}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sdn_prod_network

  # 3. Nginx React SPA Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdn2_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sdn_prod_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  sdn_prod_network:
    driver: bridge
